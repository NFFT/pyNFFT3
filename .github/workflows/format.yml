name: Format Python Code
on:
  push:
    branches:
      - "**"
    # Excludes tag pushes: a tag checks out a detached commit, and
    # create-pull-request below needs a real branch as its PR base (it would
    # otherwise fail with "the 'base' input must be supplied"). Reformatting
    # a tagged commit also doesn't make sense - it was already formatted (or
    # not) on the branch it came from.
jobs:
  python-code-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Display Python version
        run: python --version
      - name: Install packages
        run: pip install black isort
      - name: Formatter
        run: |
          black .
          isort .
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          commit-message: Auto code format
          title: Fixes by format action
          body: This is an auto-generated PR with fixes.
          labels: automated pr
          branch: python-code-format-patches
